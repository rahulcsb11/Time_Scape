name: Mini Duck Browser - Build APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'MiniDuckBrowser 2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android debug APK
        working-directory: 'MiniDuckBrowser 2'
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniDuckBrowser-APK
          path: 'MiniDuckBrowser 2/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
